# Pointer and may-alias analysis service configuration

# Calling-context depth k (k-CFA-style call-string contexts).
# 0 = context-insensitive (contexts merged), 1 = distinguish one caller call site, etc.
pointer-analysis.context-depth=1

# Number of worker threads used while propagating pointer facts to a fixpoint.
# Results are independent of this value; it only affects analysis throughput.
pointer-analysis.parallelism=1

# Directory for the durable latest snapshot (snapshot.json) and append-only query
# history (queries.jsonl). Used for crash recovery; override per deployment.
pointer-analysis.storage-dir=${java.io.tmpdir}/pointer-analysis-java
